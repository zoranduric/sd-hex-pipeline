[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sd-hex-pipeline"
version = "0.1.0"
description = "Bake real-world GIS data (elevation, land cover, coasts, borders, rivers) into a hex grid for Godot"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "rasterio>=1.3.9",
    "geopandas>=0.14",
    "pyogrio>=0.7",
    "shapely>=2.0",
    "pillow>=10.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
sdhex = "sdhex.__main__:main"

[tool.setuptools]
packages = ["sdhex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
